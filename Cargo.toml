[package]
name = "devcheck"
version = "0.1.0"
edition = "2021"
authors = ["raindrop-daichi"]
description = "A CLI tool for parallel execution of Rust quality checks (fmt/clippy/test)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
indicatif = "0.17"
chrono = "0.4"
which = "6"
async-trait = "0.1"
toml = "0.8"
notify = "6"
